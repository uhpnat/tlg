<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Yêu Thương UI - Modern Love Monotone & Sparkles</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      /* --- TÔNG MÀU TÌNH YÊU HIỆN ĐẠI (MONOTONE ROSE & SOFT BLUSH) --- */
      --love-primary: #D946EF;    
      --love-dark: #831843;       
      --love-soft: #FCE7F3;       
      --love-accent: #FB7185;     

      /* Hệ thống nền & Kính mờ */
      --bg-main: linear-gradient(135deg, #FFF1F2 0%, #FFE4E6 50%, #FCE7F3 100%);
      --bg-glass: rgba(255, 255, 255, 0.82);
      --bg-glass-strong: rgba(255, 255, 255, 0.95);
      --bg-input: rgba(255, 241, 242, 0.85);

      /* Gradient mượt mà, đồng điệu màu tình yêu */
      --primary-gradient: linear-gradient(105deg, #E11D48 0%, #F43F5E 50%, #FB7185 100%);
      --chat-card-gradient: linear-gradient(105deg, #831843 0%, #BE123C 50%, #E11D48 100%);

      /* Trạng thái */
      --badge-red: #E11D48;
      --status-online: #10B981;

      /* Typography */
      --text-primary: #1E293B;
      --text-accent: #9F1239;
      --text-secondary: #64748B;
      --text-white: #FFFFFF;

      /* Bo góc & Đổ bóng */
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-pill: 9999px;

      --shadow-soft: 0 10px 25px -5px rgba(225, 29, 72, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --shadow-floating: 0 16px 35px -8px rgba(225, 29, 72, 0.22), 0 0 20px rgba(254, 205, 211, 0.6);
      --border-shimmer: 1px solid rgba(255, 255, 255, 0.9);

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      color: var(--text-primary);
      background: linear-gradient(-45deg, #FFF1F2, #FFE4E6, #FCE7F3, #FDF2F8);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-root {
      width: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    /* --- HIỆU ỨNG BONG BÓNG TÌNH YÊU & LẤP LÁNH --- */
    .bubble-layer, .sparkle-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .love-bubble {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(244, 63, 94, 0.15));
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: floatBubble 8s infinite ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.9);
    }
    @keyframes floatBubble {
      0% { transform: translateY(100dvh) scale(0.6); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
    }

    .sparkle-dot {
      position: absolute;
      color: #F43F5E;
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.8);
      animation: twinkle 3.5s infinite ease-in-out;
      font-size: 11px;
      opacity: 0.7;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 0.95; transform: scale(1.3) rotate(45deg); }
    }

    .screen {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      padding-top: var(--safe-top);
      z-index: 2;
      animation: fadeIn 0.2s ease-out;
    }
    .screen.active {
      display: flex;
    }
    .screen::-webkit-scrollbar {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2, h3, .heading-font {
      font-family: 'Quicksand', sans-serif;
    }

    /* MÀN HÌNH 1: ĐĂNG NHẬP */
    .login-screen {
      padding: calc(var(--safe-top) + 20px) 24px calc(var(--safe-bottom) + 24px);
      justify-content: space-between;
    }
    .login-hero {
      text-align: center;
    }
    .couple-illustration {
      width: 128px;
      height: 128px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFE4E6 0%, #FFFFFF 100%);
      box-shadow: 0 12px 30px rgba(225, 29, 72, 0.2), 0 0 0 4px rgba(255, 255, 255, 0.95);
      overflow: hidden;
      border: 2px solid var(--badge-red);
    }
    .couple-illustration img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .app-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-accent);
      margin-bottom: 4px;
    }
    .app-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .login-form {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: var(--border-shimmer);
      padding: 20px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-box input {
      width: 100%;
      padding: 13px 40px 13px 18px;
      border-radius: var(--radius-pill);
      border: 1.5px solid rgba(254, 205, 211, 0.9);
      background: var(--bg-input);
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: 0.2s;
    }
    .input-box input:focus {
      border-color: var(--badge-red);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
    }
    .input-box .input-icon {
      position: absolute;
      right: 16px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--primary-gradient);
      color: var(--text-white);
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 6px 18px -4px rgba(225, 29, 72, 0.35);
      transition: transform 0.15s, filter 0.15s;
    }
    .btn-primary:hover {
      filter: brightness(1.05);
    }
    .btn-primary:active {
      transform: scale(0.97);
    }

    .pairing-card {
      background: rgba(254, 226, 226, 0.45);
      backdrop-filter: blur(12px);
      border: 1.5px dashed rgba(225, 29, 72, 0.4);
      border-radius: var(--radius-lg);
      padding: 14px;
      text-align: center;
      box-shadow: var(--shadow-soft);
    }
    .pairing-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-accent);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .pairing-input-group {
      display: flex;
      background: rgba(255, 255, 255, 0.95);
      border-radius: var(--radius-pill);
      padding: 4px 4px 4px 16px;
      border: 1px solid rgba(254, 205, 211, 0.9);
      align-items: center;
    }
    .pairing-input-group input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-primary);
      background: transparent;
    }
    .btn-pair {
      padding: 8px 18px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--primary-gradient);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .social-login {
      text-align: center;
    }
    .social-divider {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 14px;
    }
    .social-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      color: #fff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(100, 116, 139, 0.15);
      transition: transform 0.15s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
    }

    /* MÀN HÌNH 2: GÓC NHỎ CỦA TÔI (DASHBOARD) */
    .dashboard-content {
      flex: 1;
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dash-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-accent);
    }
    .notif-bell {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-glass);
      border: var(--border-shimmer);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      color: var(--text-accent);
      cursor: pointer;
      box-shadow: var(--shadow-soft);
    }
    .bell-dot {
      position: absolute;
      top: 7px;
      right: 8px;
      width: 7px;
      height: 7px;
      background: var(--badge-red);
      border-radius: 50%;
      border: 1.5px solid #fff;
    }

    .couple-banner {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(14px);
      padding: 13px 16px;
      border-radius: var(--radius-xl);
      border: var(--border-shimmer);
      box-shadow: var(--shadow-soft);
    }
    .heart-avatar-frame {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2.5px solid var(--badge-red);
      padding: 3px;
      background: #fff;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
    }
    .heart-avatar-frame img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .heart-badge-icon {
      position: absolute;
      bottom: -3px;
      right: -3px;
      background: var(--badge-red);
      color: #fff;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      border: 2px solid #fff;
    }
    .couple-stats {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .days-count {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .countdown-label {
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    .countdown-timer {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-accent);
      letter-spacing: 0.6px;
      background: rgba(225, 29, 72, 0.1);
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      width: fit-content;
    }

    /* CHAT WIDGET */
    .chat-widget-wrapper {
      position: relative;
      background: var(--bg-glass-strong);
      backdrop-filter: blur(16px);
      padding: 14px 16px 16px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-floating);
      border: var(--border-shimmer);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 8px;
    }
    .chat-widget-wrapper:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px -10px rgba(225, 29, 72, 0.3);
    }
    .chat-widget-wrapper:active {
      transform: scale(0.98);
    }
    .widget-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-accent);
      margin-bottom: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .widget-section-title::before {
      content: '♥';
      color: var(--badge-red);
      font-size: 13px;
    }
    .chat-banner-box {
      position: relative;
      background: var(--chat-card-gradient);
      border-radius: var(--radius-lg);
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      box-shadow: 0 6px 18px -4px rgba(131, 24, 67, 0.35);
    }
    .partner-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      object-fit: cover;
      flex-shrink: 0;
    }
    .chat-preview-info {
      flex: 1;
      overflow: hidden;
      padding-right: 12px;
    }
    .partner-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .last-message {
      font-size: 13px;
      opacity: 0.92;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* HUY HIỆU SỐ TIN NHẮN */
    .unread-badge {
      position: absolute;
      top: -12px;
      right: 4px;
      background: var(--badge-red);
      color: #fff;
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      border-radius: var(--radius-pill);
      border: 2.5px solid #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.45);
      animation: pulseBadge 1.8s infinite;
      z-index: 10;
    }
    .unread-badge.hidden {
      display: none;
    }
    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* FEATURE GRID */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .feature-item {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      box-shadow: var(--shadow-soft);
      border: var(--border-shimmer);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .feature-item:hover {
      transform: translateY(-3px) scale(1.02);
      background: #FFFFFF;
      box-shadow: 0 10px 22px -5px rgba(225, 29, 72, 0.2);
      border-color: rgba(225, 29, 72, 0.4);
    }
    .feature-item:active {
      transform: scale(0.96);
    }
    .feature-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #FFE4E6 0%, #FCE7F3 100%);
      color: var(--badge-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9);
      transition: transform 0.25s;
    }
    .feature-item:hover .feature-icon-box {
      transform: scale(1.1) rotate(5deg);
      color: var(--love-dark);
    }
    .feature-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
    }

    /* Bottom Navigation */
    .bottom-nav {
      height: calc(64px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-left: 12px;
      padding-right: 12px;
      border-top: 1px solid rgba(254, 205, 211, 0.7);
      flex-shrink: 0;
      z-index: 10;
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      padding: 6px 12px;
      transition: color 0.2s;
    }
    .nav-tab:hover {
      color: var(--badge-red);
    }
    .nav-tab i {
      font-size: 18px;
    }
    .nav-tab.active {
      color: var(--badge-red);
      font-weight: 700;
    }
    .nav-tab.active::before {
      content: '';
      position: absolute;
      top: -6px;
      width: 22px;
      height: 3px;
      border-radius: 3px;
      background: var(--badge-red);
    }

    /* MÀN HÌNH 3: CHI TIẾT TRÒ CHUYỆN */
    .chat-header {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(254, 205, 211, 0.7);
      z-index: 10;
    }
    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--badge-red);
      cursor: pointer;
      padding: 4px 6px;
    }
    .chat-header-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--badge-red);
    }
    .chat-user-meta h4 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-accent);
    }
    .online-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-secondary);
    }
    .online-dot {
      width: 7px;
      height: 7px;
      background: var(--status-online);
      border-radius: 50%;
    }
    .chat-header-actions {
      display: flex;
      gap: 16px;
      color: var(--badge-red);
      font-size: 17px;
    }
    .chat-header-actions i {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .chat-header-actions i:hover {
      transform: scale(1.12);
      color: var(--love-dark);
    }

    .message-stream {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, rgba(255, 241, 242, 0.4) 0%, rgba(252, 231, 243, 0.4) 100%);
    }
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 82%;
    }
    .msg-row.partner {
      align-self: flex-start;
    }
    .msg-row.me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .msg-bubble {
      padding: 10px 14px;
      font-size: 13.5px;
      line-height: 1.42;
      word-break: break-word;
    }
    .msg-row.partner .msg-bubble {
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-primary);
      border: 1px solid rgba(254, 205, 211, 0.8);
      border-radius: 18px 18px 18px 4px;
      box-shadow: 0 3px 8px rgba(100, 116, 139, 0.04);
    }
    .msg-row.me .msg-bubble {
      background: var(--primary-gradient);
      color: #FFFFFF;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
    }

    .quick-actions-bar {
      padding: 10px 14px 6px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      border-top: 1px solid rgba(254, 205, 211, 0.7);
    }
    .quick-action-card {
      background: linear-gradient(180deg, #FFFFFF 0%, #FFF1F2 100%);
      border: 1px solid rgba(254, 205, 211, 0.7);
      border-radius: var(--radius-md);
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .quick-action-card:hover {
      background: #FFE4E6;
      transform: translateY(-2px);
    }
    .quick-action-card:active {
      transform: scale(0.94);
    }
    .quick-action-card i {
      font-size: 17px;
      color: var(--badge-red);
    }
    .quick-action-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
    }
    .quick-action-sub {
      font-size: 9.5px;
      color: var(--text-secondary);
    }

    .chat-input-bar {
      padding: 8px 14px calc(14px + var(--safe-bottom));
      background: rgba(255, 255, 255, 0.92);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-input-wrapper {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid rgba(254, 205, 211, 0.8);
      border-radius: var(--radius-pill);
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-primary);
    }
    .chat-input-wrapper i {
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s;
    }
    .chat-input-wrapper i:hover {
      color: var(--badge-red);
    }
    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--primary-gradient);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
      transition: transform 0.15s, filter 0.15s;
    }
    .send-btn:hover {
      filter: brightness(1.05);
      transform: scale(1.05);
    }

    /* Animations & Toast */
    .shake-anim {
      animation: shakeView 0.45s ease-in-out;
    }
    @keyframes shakeView {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .floating-heart {
      position: absolute;
      bottom: 80px;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 2.1s ease-out forwards;
      z-index: 50;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-300px) scale(1.4) rotate(10deg); }
    }

    .toast-box {
      position: absolute;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--love-dark);
      color: #fff;
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(131, 24, 67, 0.35);
    }
    .toast-box.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="app-root" id="appRoot">
    <!-- Các lớp hiệu ứng bong bóng và lấp lánh -->
    <div class="bubble-layer" id="bubbleLayer"></div>
    <div class="sparkle-layer" id="sparkleLayer"></div>
    <div class="toast-box" id="toastBox"></div>

    <!-- MÀN HÌNH 1: ĐĂNG NHẬP -->
    <section class="screen login-screen active" id="screen-login">
      <div class="login-hero">
        <div class="couple-illustration">
          <img id="loginHeroImg" src="" alt="Couple Illustration">
        </div>
        <h1 class="app-title" id="loginAppTitle"></h1>
        <p class="app-subtitle" id="loginAppSubtitle"></p>
      </div>

      <form class="login-form" id="loginForm">
        <div class="input-box">
          <input type="text" id="inputAccount" required>
        </div>
        <div class="input-box">
          <input type="password" id="inputPassword" required>
          <i class="fa-regular fa-eye-slash input-icon" id="togglePwdBtn"></i>
        </div>
        <button type="submit" class="btn-primary" id="btnLoginSubmit"></button>
      </form>

      <div class="pairing-card">
        <div class="pairing-title" id="pairingTitle"></div>
        <div class="pairing-input-group">
          <input type="text" id="inputPairCode">
          <button type="button" class="btn-pair" id="btnPairSubmit"></button>
        </div>
      </div>

      <div class="social-login">
        <div class="social-divider" id="socialDividerText"></div>
        <div class="social-icons" id="socialButtonsContainer"></div>
      </div>
    </section>

    <!-- MÀN HÌNH 2: GÓC NHỎ CỦA TÔI (MAIN DASHBOARD) -->
    <section class="screen" id="screen-dashboard">
      <div class="dashboard-content">
        <div class="dash-header">
          <h2 class="dash-title" id="dashHeaderTitle"></h2>
          <div class="notif-bell" id="notifBellBtn">
            <i class="fa-regular fa-bell"></i>
            <span class="bell-dot" id="bellDot"></span>
          </div>
        </div>

        <div class="couple-banner">
          <div class="heart-avatar-frame">
            <img id="dashCoupleAvatar" src="" alt="Couple">
            <div class="heart-badge-icon"><i class="fa-solid fa-heart"></i></div>
          </div>
          <div class="couple-stats">
            <div class="days-count" id="dashDaysTogether"></div>
            <div class="countdown-label" id="dashCountdownLabel"></div>
            <div class="countdown-timer" id="dashCountdownTimer"></div>
          </div>
        </div>

        <!-- Mục Chat Nổi Bật + Huy Hiệu An Toàn Ở Góc Trên Bên Phải -->
        <div class="chat-widget-wrapper" id="featuredChatCard">
          <div class="widget-section-title" id="chatWidgetHeading"></div>
          <div class="chat-banner-box">
            <img class="partner-avatar" id="chatWidgetAvatar" src="" alt="Partner">
            <div class="chat-preview-info">
              <div class="partner-name" id="chatWidgetPartnerName"></div>
              <div class="last-message" id="chatWidgetLastMsg"></div>
            </div>
            <div class="unread-badge" id="chatUnreadBadge"></div>
          </div>
        </div>

        <div class="feature-grid" id="featureGridContainer"></div>
      </div>

      <nav class="bottom-nav" id="bottomNavContainer"></nav>
    </section>

    <!-- MÀN HÌNH 3: CHI TIẾT TRÒ CHUYỆN -->
    <section class="screen" id="screen-chat">
      <header class="chat-header">
        <div class="chat-header-left">
          <button class="back-btn" id="btnBackToDash"><i class="fa-solid fa-chevron-left"></i></button>
          <img class="chat-header-avatar" id="chatRoomAvatar" src="" alt="Avatar">
          <div class="chat-user-meta">
            <h4 id="chatRoomTitle"></h4>
            <div class="online-badge">
              <span class="online-dot"></span>
              <span id="chatRoomStatus"></span>
            </div>
          </div>
        </div>
        <div class="chat-header-actions">
          <i class="fa-solid fa-phone" id="btnAudioCall"></i>
          <i class="fa-solid fa-video" id="btnVideoCall"></i>
        </div>
      </header>

      <div class="message-stream" id="messageStream"></div>
      <div class="quick-actions-bar" id="quickActionsContainer"></div>

      <form class="chat-input-bar" id="chatInputForm">
        <div class="chat-input-wrapper">
          <input type="text" id="chatMessageInput" autocomplete="off">
          <i class="fa-regular fa-image"></i>
        </div>
        <button type="submit" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </section>

  </div>

  <script>
    const MOCK_BACKEND_RESPONSE = {
      notifications: {
        loginSuccess: "Đăng nhập thành công! ✨",
        pairRequested: "Đã gửi lời mời ghép đôi tới mã: ",
        featureOpened: "Mở tính năng: ",
        touchSent: "👋 Đã gửi rung máy tới người ấy!",
        heartbeatSent: "💓 Đang đồng bộ nhịp đập trái tim...",
        incomingMsgAlert: "✨ Người ấy vừa nhắn tin cho bạn!"
      },
      authScreen: {
        appTitle: "Yêu Thương",
        appSubtitle: "Không gian riêng tư chỉ dành cho hai ta",
        heroImageUrl: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=400&q=80",
        accountPlaceholder: "Email / Số điện thoại",
        passwordPlaceholder: "Mật khẩu",
        defaultAccountValue: "",
        defaultPasswordValue: "",
        loginButtonText: "ĐĂNG NHẬP",
        pairingSection: {
          title: "KẾT NỐI ĐÔI",
          inputPlaceholder: "Nhập mã của người ấy",
          buttonText: "Kết nối"
        },
        socialSection: {
          dividerText: "Đăng nhập mạng xã hội",
          providers: [
            { id: "facebook", icon: "fa-brands fa-facebook-f", bgColor: "#1877F2" },
            { id: "twitter", icon: "fa-brands fa-twitter", bgColor: "#1DA1F2" },
            { id: "google", icon: "fa-brands fa-youtube", bgColor: "#E11D48" },
            { id: "tiktok", icon: "fa-brands fa-tiktok", bgColor: "#1E293B" }
          ]
        }
      },
      dashboardScreen: {
        headerTitle: "Góc Nhỏ Của Tôi",
        hasNotification: true,
        coupleBanner: {
          avatarUrl: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=300&q=80",
          daysTogetherPrefix: "Bên nhau:",
          daysCount: 520,
          daysUnit: "ngày",
          countdownLabel: "Đếm ngược sự kiện:",
          countdownInitialSeconds: 50400
        },
        featuredChatWidget: {
          sectionHeading: "TRÒ CHUYỆN VỚI NGƯỜI ẤY",
          partnerName: "Người ấy",
          partnerAvatarUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80",
          lastMessagePreview: "Anh sắp về đến nhà rồi...",
          unreadCount: 5
        },
        featuresGrid: [
          { id: "diary", title: "Nhật ký chung", icon: "fa-solid fa-book-medical" },
          { id: "wishlist", title: "Danh sách mong ước", icon: "fa-solid fa-clipboard-check" },
          { id: "calendar", title: "Lịch hẹn hò", icon: "fa-regular fa-calendar-check" },
          { id: "games", title: "Trò chơi cặp đôi", icon: "fa-solid fa-gamepad" },
          { id: "map", title: "Bản đồ cặp đôi", icon: "fa-solid fa-map-location-dot" },
          { id: "bank", title: "Ngân hàng tình yêu", icon: "fa-solid fa-piggy-bank" }
        ],
        bottomNav: [
          { id: "home", label: "Trang chủ", icon: "fa-solid fa-house", isActive: false },
          { id: "corner", label: "Góc Nhỏ", icon: "fa-solid fa-book-open", isActive: true },
          { id: "call", label: "Gọi nhanh", icon: "fa-solid fa-phone-volume", isActive: false },
          { id: "moments", label: "Kỷ niệm", icon: "fa-regular fa-heart", isActive: false },
          { id: "profile", label: "Cá nhân", icon: "fa-regular fa-user", isActive: false }
        ]
      },
      chatScreen: {
        roomTitle: "Yêu Thương ✨",
        onlineStatusText: "Đang hoạt động",
        partnerAvatarUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80",
        inputPlaceholder: "Gửi lời yêu thương...",
        quickActions: [
          { id: "heart", title: "Thả tim nhanh", subtitle: "(lấp lánh)", icon: "fa-solid fa-heart" },
          { id: "touch", title: "Chạm tay", subtitle: "(rung máy)", icon: "fa-solid fa-hand-sparkles" },
          { id: "pulse", title: "Cùng nhịp đập", subtitle: "(đồng bộ)", icon: "fa-solid fa-heart-pulse" }
        ],
        messages: [
          { id: 101, sender: "partner", text: "Giao diện màu tình yêu có bong bóng nổi và lấp lánh nhìn nên thơ quá anh nhỉ!" },
          { id: 102, sender: "me", text: "Đúng rồi, tông màu đồng điệu, dịu ngọt và cực kỳ hiện đại ✨" },
          { id: 103, sender: "partner", text: "Tối nay mình đi ăn lẩu nha?" },
          { id: 104, sender: "me", text: "Chốt luôn! Đợi anh tầm 15 phút nữa nhé." },
          { id: 105, sender: "partner", text: "Anh sắp về đến nhà rồi..." }
        ]
      }
    };

    let appState = structuredClone(MOCK_BACKEND_RESPONSE);
    let currentScreenId = 'screen-login';

    function initVisualEffects() {
      const sparkleLayer = document.getElementById('sparkleLayer');
      const bubbleLayer = document.getElementById('bubbleLayer');
      
      const sparkleSymbols = ['✦', '✧', '⋆', '♥'];
      let sparkleHtml = '';
      for (let i = 0; i < 15; i++) {
        const top = Math.random() * 96;
        const left = Math.random() * 94;
        const delay = (Math.random() * 4).toFixed(1);
        const duration = (3 + Math.random() * 2.5).toFixed(1);
        const sym = sparkleSymbols[i % sparkleSymbols.length];
        sparkleHtml += `<span class="sparkle-dot" style="top:${top}%; left:${left}%; animation-delay:${delay}s; animation-duration:${duration}s">${sym}</span>`;
      }
      sparkleLayer.innerHTML = sparkleHtml;

      setInterval(() => {
        if (bubbleLayer && bubbleLayer.childElementCount < 8) {
          const bubble = document.createElement('div');
          bubble.className = 'love-bubble';
          const size = Math.floor(Math.random() * 24) + 16;
          bubble.style.width = `${size}px`;
          bubble.style.height = `${size}px`;
          bubble.style.left = `${Math.random() * 88 + 6}%`;
          bubble.style.animationDuration = `${Math.random() * 4 + 6}s`;
          if (Math.random() > 0.6) bubble.innerHTML = '♥';
          bubbleLayer.appendChild(bubble);
          setTimeout(() => bubble.remove(), 10000);
        }
      }, 1200);
    }

    function emitEventToHostApp(eventName, payload) {
      window.parent.postMessage({ source: 'COUPLE_UI_EMBED', event: eventName, data: payload }, '*');
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ event: eventName, data: payload }));
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toastBox');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function navigateTo(screenId) {
      currentScreenId = screenId;
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'screen-chat') {
        appState.dashboardScreen.featuredChatWidget.unreadCount = 0;
        renderUnreadBadge();
        scrollToBottomChat();
      }
      emitEventToHostApp('SCREEN_CHANGED', { screenId });
    }

    function hydrateUI(data) {
      const auth = data.authScreen;
      document.getElementById('loginHeroImg').src = auth.heroImageUrl;
      document.getElementById('loginAppTitle').textContent = auth.appTitle;
      document.getElementById('loginAppSubtitle').textContent = auth.appSubtitle;
      document.getElementById('inputAccount').placeholder = auth.accountPlaceholder;
      document.getElementById('inputAccount').value = auth.defaultAccountValue || '';
      document.getElementById('inputPassword').placeholder = auth.passwordPlaceholder;
      document.getElementById('inputPassword').value = auth.defaultPasswordValue || '';
      document.getElementById('btnLoginSubmit').textContent = auth.loginButtonText;
      document.getElementById('pairingTitle').textContent = auth.pairingSection.title;
      document.getElementById('inputPairCode').placeholder = auth.pairingSection.inputPlaceholder;
      document.getElementById('btnPairSubmit').textContent = auth.pairingSection.buttonText;
      document.getElementById('socialDividerText').textContent = auth.socialSection.dividerText;

      document.getElementById('socialButtonsContainer').innerHTML = auth.socialSection.providers.map(p => `
        <button type="button" class="social-btn" style="background: ${p.bgColor}" onclick="emitEventToHostApp('SOCIAL_LOGIN', '${p.id}')">
          <i class="${p.icon}"></i>
        </button>
      `).join('');

      const dash = data.dashboardScreen;
      document.getElementById('dashHeaderTitle').textContent = dash.headerTitle;
      document.getElementById('bellDot').style.display = dash.hasNotification ? 'block' : 'none';
      document.getElementById('dashCoupleAvatar').src = dash.coupleBanner.avatarUrl;
      document.getElementById('dashDaysTogether').textContent = 
        `${dash.coupleBanner.daysTogetherPrefix} ${dash.coupleBanner.daysCount} ${dash.coupleBanner.daysUnit}`;
      document.getElementById('dashCountdownLabel').textContent = dash.coupleBanner.countdownLabel;

      document.getElementById('chatWidgetHeading').textContent = dash.featuredChatWidget.sectionHeading;
      document.getElementById('chatWidgetAvatar').src = dash.featuredChatWidget.partnerAvatarUrl;
      document.getElementById('chatWidgetPartnerName').textContent = dash.featuredChatWidget.partnerName;
      document.getElementById('chatWidgetLastMsg').textContent = dash.featuredChatWidget.lastMessagePreview;
      renderUnreadBadge();

      document.getElementById('featureGridContainer').innerHTML = dash.featuresGrid.map(feat => `
        <div class="feature-item" onclick="handleFeatureClick('${feat.id}', '${feat.title}')">
          <div class="feature-icon-box"><i class="${feat.icon}"></i></div>
          <div class="feature-label">${feat.title}</div>
        </div>
      `).join('');

      document.getElementById('bottomNavContainer').innerHTML = dash.bottomNav.map(tab => `
        <div class="nav-tab ${tab.isActive ? 'active' : ''}" onclick="handleNavClick('${tab.id}')">
          <i class="${tab.icon}"></i>
          <span>${tab.label}</span>
        </div>
      `).join('');

      const chat = data.chatScreen;
      document.getElementById('chatRoomAvatar').src = chat.partnerAvatarUrl;
      document.getElementById('chatRoomTitle').textContent = chat.roomTitle;
      document.getElementById('chatRoomStatus').textContent = chat.onlineStatusText;
      document.getElementById('chatMessageInput').placeholder = chat.inputPlaceholder;

      document.getElementById('quickActionsContainer').innerHTML = chat.quickActions.map(act => `
        <div class="quick-action-card" onclick="triggerCoupleAction('${act.id}')">
          <i class="${act.icon}"></i>
          <div class="quick-action-title">${act.title}</div>
          <div class="quick-action-sub">${act.subtitle}</div>
        </div>
      `).join('');

      renderMessagesList();
    }

    function renderUnreadBadge() {
      const badge = document.getElementById('chatUnreadBadge');
      const count = appState.dashboardScreen.featuredChatWidget.unreadCount;
      badge.textContent = count > 99 ? '99+' : count;
      badge.classList.toggle('hidden', count <= 0);
    }

    function renderMessagesList() {
      const stream = document.getElementById('messageStream');
      const partnerAvatar = appState.chatScreen.partnerAvatarUrl;
      stream.innerHTML = appState.chatScreen.messages.map(msg => `
        <div class="msg-row ${msg.sender}">
          ${msg.sender === 'partner' ? `<img class="msg-avatar" src="${partnerAvatar}" alt="p">` : ''}
          <div class="msg-bubble">${msg.text}</div>
        </div>
      `).join('');
    }

    function scrollToBottomChat() {
      const stream = document.getElementById('messageStream');
      stream.scrollTop = stream.scrollHeight;
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const account = document.getElementById('inputAccount').value;
      emitEventToHostApp('LOGIN_SUBMIT', { account });
      showToast(appState.notifications.loginSuccess);
      navigateTo('screen-dashboard');
    });

    document.getElementById('togglePwdBtn').addEventListener('click', function() {
      const pwd = document.getElementById('inputPassword');
      const isPwd = pwd.type === 'password';
      pwd.type = isPwd ? 'text' : 'password';
      this.className = isPwd ? 'fa-regular fa-eye input-icon' : 'fa-regular fa-eye-slash input-icon';
    });

    document.getElementById('btnPairSubmit').addEventListener('click', () => {
      const code = document.getElementById('inputPairCode').value.trim();
      emitEventToHostApp('PAIR_SUBMIT', { code });
      showToast(appState.notifications.pairRequested + (code || 'LOVE520'));
    });

    document.getElementById('featuredChatCard').addEventListener('click', () => navigateTo('screen-chat'));
    document.getElementById('btnBackToDash').addEventListener('click', () => navigateTo('screen-dashboard'));

    function handleFeatureClick(featureId, featureTitle) {
      emitEventToHostApp('FEATURE_CLICKED', { featureId, featureTitle });
      showToast(appState.notifications.featureOpened + featureTitle);
    }

    function handleNavClick(tabId) {
      appState.dashboardScreen.bottomNav.forEach(t => t.isActive = (t.id === tabId));
      hydrateUI(appState);
      emitEventToHostApp('NAV_TAB_CHANGED', { tabId });
    }

    document.getElementById('chatInputForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chatMessageInput');
      const text = input.value.trim();
      if (!text) return;

      const newMsg = { id: Date.now(), sender: 'me', text };
      appState.chatScreen.messages.push(newMsg);
      appState.dashboardScreen.featuredChatWidget.lastMessagePreview = text;
      input.value = '';
      renderMessagesList();
      document.getElementById('chatWidgetLastMsg').textContent = text;
      scrollToBottomChat();
      emitEventToHostApp('MESSAGE_SENT', newMsg);
    });

    function triggerCoupleAction(actionId) {
      const root = document.getElementById('appRoot');
      if (actionId === 'heart') {
        const icons = ['❤️', '✨', '💖', '♥'];
        for (let i = 0; i < 9; i++) {
          setTimeout(() => createFloatingHeart(root, icons[i % icons.length]), i * 100);
        }
      } else if (actionId === 'touch') {
        root.classList.remove('shake-anim');
        void root.offsetWidth;
        root.classList.add('shake-anim');
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        showToast(appState.notifications.touchSent);
      } else if (actionId === 'pulse') {
        createFloatingHeart(root, '💓');
        showToast(appState.notifications.heartbeatSent);
      }
      emitEventToHostApp('COUPLE_QUICK_ACTION', { actionId });
    }

    function createFloatingHeart(container, symbol = '❤️') {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = symbol;
      heart.style.left = Math.floor(Math.random() * 75 + 12) + '%';
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 2100);
    }

    function startCountdownTimer() {
      let totalSeconds = appState.dashboardScreen.coupleBanner.countdownInitialSeconds;
      const timerEl = document.getElementById('dashCountdownTimer');
      setInterval(() => {
        if (totalSeconds > 0) totalSeconds--;
        const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        timerEl.textContent = `${hrs} h ${mins} m ${secs} s`;
      }, 1000);
    }

    window.CoupleApp = {
      setBackendData: function(newBackendData) {
        appState = { ...appState, ...newBackendData };
        hydrateUI(appState);
      },
      navigate: function(screenId) {
        navigateTo(screenId);
      },
      pushIncomingMessage: function(text) {
        appState.chatScreen.messages.push({ id: Date.now(), sender: 'partner', text });
        appState.dashboardScreen.featuredChatWidget.lastMessagePreview = text;
        document.getElementById('chatWidgetLastMsg').textContent = text;

        if (currentScreenId !== 'screen-chat') {
          appState.dashboardScreen.featuredChatWidget.unreadCount += 1;
          renderUnreadBadge();
        } else {
          renderMessagesList();
          scrollToBottomChat();
        }
        showToast(appState.notifications.incomingMsgAlert);
      }
    };

    window.addEventListener('message', (event) => {
      const { action, payload } = event.data || {};
      if (action === 'SET_DATA') window.CoupleApp.setBackendData(payload);
      if (action === 'NAVIGATE') window.CoupleApp.navigate(payload);
      if (action === 'INCOMING_MSG') window.CoupleApp.pushIncomingMessage(payload);
    });

    window.addEventListener('DOMContentLoaded', () => {
      initVisualEffects();
      const params = new URLSearchParams(window.location.search);
      const initScreen = params.get('screen');
      hydrateUI(appState);
      startCountdownTimer();
      if (initScreen && document.getElementById(`screen-${initScreen}`)) {
        navigateTo(`screen-${initScreen}`);
      }
    });
  </script>
</body>
</html>

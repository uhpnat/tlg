<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Không khóa zoom (maximum-scale/user-scalable) để giữ khả năng truy cập; input đủ 16px nên iOS không tự phóng to -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E0F2FE">
<title>TPVT - Ice Blue (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ---------- Design tokens: Ice Blue monotone ---------- */
    --blue-primary: #38BDF8;   /* trang trí: viền, vạch, ánh sáng (không dùng làm chữ) */
    --blue-action-from: #0A78B5;
    --blue-action-to: #0369A1; /* chữ trắng trên nền này đạt AA (4,8 – 5,9) */
    --blue-dark: #0369A1;      /* chữ nhấn, icon có nghĩa */
    --blue-mid: #0284C7;
    --blue-light: #E0F2FE;
    --blue-soft: #F0F9FF;
    --blue-line: #BAE6FD;

    --text-primary: #0F172A;
    --text-secondary: #475569; /* 7,6:1 trên trắng, 6,6:1 trên blue-light */
    --text-on-action: #FFFFFF;

    --badge-red: #E11D48;
    --status-online: #10B981;
    --warn: #B45309;
    --warn-bg: #FEF3C7;

    --glass: rgba(255, 255, 255, 0.86);
    --glass-strong: rgba(255, 255, 255, 0.96);
    --input-bg: rgba(224, 242, 254, 0.55);

    --action-gradient: linear-gradient(135deg, var(--blue-action-from) 0%, var(--blue-action-to) 100%);

    --radius-xl: 24px; --radius-lg: 18px; --radius-md: 14px; --radius-pill: 9999px;
    --shadow-soft: 0 10px 25px -5px rgba(56, 189, 248, 0.14), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    --shadow-float: 0 16px 35px -8px rgba(56, 189, 248, 0.24), 0 0 20px rgba(224, 242, 254, 0.8);
    --shimmer: 1px solid rgba(255, 255, 255, 0.95);

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --tap: 44px;
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-out: cubic-bezier(0.25, 1, 0.5, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
    font-family: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--text-primary);
    background: linear-gradient(160deg, #E0F2FE 0%, #F0F9FF 55%, #F8FAFC 100%);
    -webkit-text-size-adjust: 100%;
  }
  /* Chặn chọn chữ ở phần giao diện, nhưng vẫn cho gõ và chọn nội dung tin nhắn */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea, .selectable { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }

  h1, h2, h3, h4, .heading { font-family: 'Quicksand', 'Nunito', system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--blue-mid); outline-offset: 2px; }

  .ico { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Khung ứng dụng ---------- */
  .app-root {
    position: relative; width: 100%; max-width: 480px; margin: 0 auto; overflow: hidden;
    height: var(--app-h, 100dvh);   /* JS cập nhật theo visualViewport để bàn phím không che ô nhập */
    background: rgba(255, 255, 255, 0.72);
    box-shadow: 0 25px 50px -12px rgba(56, 189, 248, 0.2);
  }

  /* Hiệu ứng nền nhẹ, chỉ bằng CSS (không timer JS) */
  .ambient { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .ambient .bub {
    position: absolute; bottom: -60px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(56,189,248,.12));
    border: 1px solid rgba(255,255,255,.7);
    animation: floatUp var(--d, 12s) linear infinite; animation-delay: var(--s, 0s);
  }
  .ambient .spk { position: absolute; color: var(--blue-primary); font-size: 11px; opacity: .55; animation: twinkle 4s ease-in-out infinite; animation-delay: var(--s, 0s); }
  @keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .55; } 85% { opacity: .55; } 100% { transform: translateY(-105dvh) scale(1.1); opacity: 0; } }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.7); } 50% { opacity: .8; transform: scale(1.25); } }

  /* ---------- Màn hình ---------- */
  .screen {
    position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
    padding-top: var(--safe-top); overflow: hidden;
    background: linear-gradient(180deg, rgba(240,249,255,.9), rgba(224,242,254,.65));
    visibility: hidden; opacity: 0; transform: translateX(28px); pointer-events: none;
    transition: transform .35s var(--ease-out), opacity .3s ease, visibility 0s linear .35s;
  }
  .screen.active { visibility: visible; opacity: 1; transform: none; pointer-events: auto; transition-delay: 0s; }
  .screen.peek { visibility: visible; opacity: 1; }
  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { display: none; }

  /* ---------- Nút & ô nhập dùng chung ---------- */
  .btn-primary {
    width: 100%; min-height: 48px; padding: 12px 18px; border-radius: var(--radius-pill);
    background: var(--action-gradient); color: var(--text-on-action);
    font-family: 'Quicksand', system-ui, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .4px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 6px 18px -4px rgba(3, 105, 161, 0.4);
    transition: transform .2s var(--ease-spring), filter .2s, opacity .2s;
  }
  .btn-primary:active { transform: scale(.97); }
  .btn-primary[disabled] { opacity: .65; cursor: default; }
  .btn-ghost {
    min-height: var(--tap); padding: 10px 18px; border-radius: var(--radius-pill);
    border: 1.5px solid var(--blue-line); background: var(--glass-strong); color: var(--blue-dark); font-weight: 700;
  }
  .icon-btn {
    width: var(--tap); height: var(--tap); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    color: var(--blue-dark); font-size: 20px; transition: transform .2s var(--ease-spring), background .2s;
  }
  .icon-btn:active { transform: scale(.88); }

  .field {
    width: 100%; min-height: 48px; padding: 12px 48px 12px 18px; border-radius: var(--radius-pill);
    border: 1.5px solid var(--blue-line); background: var(--input-bg);
    font: inherit; font-size: 16px; color: var(--text-primary); outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field::placeholder { color: #64748B; }
  .field:focus { border-color: var(--blue-mid); background: #fff; box-shadow: 0 0 0 4px rgba(56,189,248,.2); }
  .field.invalid { border-color: var(--badge-red); }
  .field-wrap { position: relative; display: flex; align-items: center; }
  .field-wrap .icon-btn { position: absolute; right: 2px; }

  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.45); border-top-color: #fff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 1. Đăng nhập ---------- */
  .login-screen .scroll { display: flex; flex-direction: column; justify-content: space-between; gap: 20px; padding: 20px 24px calc(var(--safe-bottom) + 24px); }
  .login-hero { text-align: center; }
  .hero-img {
    width: 120px; height: 120px; margin: 0 auto 12px; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--blue-primary); background: #fff;
    box-shadow: 0 12px 30px rgba(56,189,248,.22), 0 0 0 4px rgba(255,255,255,.95);
  }
  .hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .app-title { font-size: 30px; font-weight: 700; color: var(--blue-dark); line-height: 1.15; }
  .app-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
  .card-glass { background: var(--glass); border: var(--shimmer); border-radius: var(--radius-xl); box-shadow: var(--shadow-soft); }
  .login-form { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .form-msg { font-size: 14px; font-weight: 600; min-height: 1.3em; padding: 0 6px; }
  .form-msg.err { color: var(--badge-red); }
  .pairing-card { padding: 14px; text-align: center; border: 1.5px dashed rgba(2,132,199,.45); background: rgba(224,242,254,.55); border-radius: var(--radius-lg); }
  .pairing-title { font-size: 13px; font-weight: 700; color: var(--blue-dark); letter-spacing: .6px; margin-bottom: 10px; }
  .pairing-row { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: var(--radius-pill); padding: 4px 4px 4px 16px; border: 1px solid var(--blue-line); }
  .pairing-row input { flex: 1; min-width: 0; min-height: 44px; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: var(--text-primary); }
  .pairing-row .btn-primary { width: auto; min-height: 44px; padding: 8px 18px; font-size: 14px; }

  /* ---------- 2. Trang chính ---------- */
  .dash-pad { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
  .dash-header { display: flex; align-items: center; justify-content: space-between; }
  .dash-title { font-size: 22px; font-weight: 700; color: var(--blue-dark); }
  .bell { position: relative; background: var(--glass); border: var(--shimmer); box-shadow: var(--shadow-soft); }
  .bell-dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--badge-red); border: 2px solid #fff; }

  .couple-banner { display: flex; align-items: center; gap: 14px; padding: 13px 16px; }
  .avatar-frame { position: relative; width: 70px; height: 70px; flex-shrink: 0; border-radius: 50%; border: 2.5px solid var(--blue-primary); padding: 3px; background: #fff; box-shadow: 0 4px 12px rgba(56,189,248,.25); }
  .avatar-frame img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .avatar-heart { position: absolute; right: -3px; bottom: -3px; width: 24px; height: 24px; border-radius: 50%; background: var(--blue-mid); color: #fff; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .couple-stats { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .days-count { font-size: 16px; font-weight: 700; }
  .countdown-label { font-size: 12px; color: var(--text-secondary); }
  .countdown-timer { font-size: 14px; font-weight: 700; color: var(--blue-dark); background: rgba(56,189,248,.14); padding: 2px 10px; border-radius: var(--radius-pill); width: fit-content; font-variant-numeric: tabular-nums; }

  .chat-widget { position: relative; display: block; width: 100%; text-align: left; margin-top: 8px; padding: 14px 16px 16px; background: var(--glass-strong); border: var(--shimmer); border-radius: var(--radius-xl); box-shadow: var(--shadow-float); transition: transform .25s var(--ease-spring); }
  .chat-widget:active { transform: scale(.98); }
  .widget-title { display: flex; width: 100%; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--blue-dark); letter-spacing: .8px; text-transform: uppercase; margin-bottom: 10px; }
  .widget-title::before { content: '✦'; color: var(--blue-primary); font-size: 13px; }
  .chat-banner { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: var(--radius-lg); color: #fff; background: linear-gradient(110deg, var(--blue-action-from) 0%, var(--blue-action-to) 100%); box-shadow: 0 6px 18px -4px rgba(3,105,161,.4); }
  .partner-avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); object-fit: cover; flex-shrink: 0; }
  .chat-preview { display: block; flex: 1; min-width: 0; padding-right: 14px; }
  .partner-name { display: block; font-size: 16px; font-weight: 700; }
  .last-msg { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread { position: absolute; top: -12px; right: 6px; min-width: 28px; height: 28px; padding: 0 7px; border-radius: var(--radius-pill); background: var(--badge-red); color: #fff; border: 2.5px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; box-shadow: 0 4px 12px rgba(225,29,72,.4); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .feature { min-height: 96px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; background: var(--glass); border: var(--shimmer); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); transition: transform .25s var(--ease-spring); }
  .feature:active { transform: scale(.95); }
  .feature-ico { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, var(--blue-light), var(--blue-soft)); color: var(--blue-mid); display: flex; align-items: center; justify-content: center; font-size: 21px; }
  .feature-label { font-size: 12.5px; font-weight: 700; line-height: 1.25; }

  .bottom-nav { flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; height: calc(64px + var(--safe-bottom)); padding: 0 8px var(--safe-bottom); background: rgba(255,255,255,.92); border-top: 1px solid rgba(186,230,253,.8); position: relative; z-index: 3; }
  .nav-tab { position: relative; flex: 1; min-width: var(--tap); min-height: var(--tap); padding: 4px 2px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--text-secondary); transition: transform .2s; }
  .nav-tab .ico { font-size: 21px; }
  .nav-tab:active { transform: scale(.9); }
  .nav-tab[aria-current="page"] { color: var(--blue-dark); font-weight: 700; }
  .nav-tab[aria-current="page"]::before { content: ''; position: absolute; top: -5px; width: 24px; height: 3px; border-radius: 3px; background: var(--blue-primary); }

  /* ---------- 3. Trò chuyện ---------- */
  .chat-header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; background: var(--glass); border-bottom: 1px solid rgba(186,230,253,.8); position: relative; z-index: 3; }
  .chat-head-left { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .head-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-primary); margin-left: 2px; }
  .head-meta { margin-left: 8px; min-width: 0; }
  .head-meta h2 { font-size: 16px; font-weight: 700; color: var(--blue-dark); line-height: 1.2; }
  .online { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .online i { width: 8px; height: 8px; border-radius: 50%; background: var(--status-online); display: inline-block; }
  .chat-head-actions { display: flex; }

  .stream { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, rgba(224,242,254,.3), rgba(240,249,255,.55)); -webkit-overflow-scrolling: touch; }
  .stream::-webkit-scrollbar { display: none; }
  .day-sep { align-self: center; font-size: 12px; font-weight: 600; color: var(--text-secondary); background: rgba(255,255,255,.8); border-radius: var(--radius-pill); padding: 2px 12px; }
  .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 84%; animation: pop .3s var(--ease-spring); }
  .msg.partner { align-self: flex-start; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .bubble-col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .msg.me .bubble-col { align-items: flex-end; }
  .bubble { padding: 10px 14px; font-size: 16px; line-height: 1.45; word-break: break-word; }
  .msg.partner .bubble { background: rgba(255,255,255,.97); color: var(--text-primary); border: 1px solid var(--blue-line); border-radius: 18px 18px 18px 4px; box-shadow: 0 3px 8px rgba(100,116,139,.05); }
  .msg.me .bubble { background: var(--action-gradient); color: #fff; border-radius: 18px 18px 4px 18px; box-shadow: 0 4px 12px rgba(3,105,161,.25); }
  .msg-meta { font-size: 12px; color: var(--text-secondary); padding: 0 4px; }
  .msg.failed .bubble { background: #fff; color: var(--badge-red); border: 1.5px solid var(--badge-red); }
  .typing { align-self: flex-start; display: flex; gap: 5px; padding: 12px 14px; background: rgba(255,255,255,.97); border: 1px solid var(--blue-line); border-radius: 18px 18px 18px 4px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-mid); opacity: .5; animation: dot 1.2s ease-in-out infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%,80%,100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-4px); opacity: .9; } }

  .quick-bar { flex-shrink: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 14px 4px; background: rgba(255,255,255,.9); border-top: 1px solid rgba(186,230,253,.8); }
  .quick { min-height: 56px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: linear-gradient(180deg, #fff, var(--blue-light)); border: 1px solid var(--blue-line); border-radius: var(--radius-md); transition: transform .2s var(--ease-spring); }
  .quick:active { transform: scale(.93); }
  .quick .ico { font-size: 18px; color: var(--blue-mid); }
  .quick b { font-size: 12px; }
  .quick small { font-size: 11px; color: var(--text-secondary); }

  .input-bar { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 6px 12px calc(10px + var(--safe-bottom)); background: rgba(255,255,255,.94); }
  .kb .input-bar, .kb .bottom-nav { padding-bottom: 8px; }
  .input-wrap { flex: 1; min-width: 0; display: flex; align-items: center; background: var(--input-bg); border: 1px solid var(--blue-line); border-radius: var(--radius-pill); padding-left: 16px; transition: border-color .2s, box-shadow .2s; }
  .input-wrap:focus-within { border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(56,189,248,.2); }
  .input-wrap input { flex: 1; min-width: 0; min-height: 44px; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: var(--text-primary); }
  .input-wrap input::placeholder { color: #64748B; }
  .input-wrap .icon-btn { color: var(--text-secondary); }
  .send { width: var(--tap); height: var(--tap); border-radius: 50%; background: var(--action-gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 19px; box-shadow: 0 4px 12px rgba(3,105,161,.35); transition: transform .2s var(--ease-spring), opacity .2s; }
  .send:active { transform: scale(.9); }
  .send[disabled] { opacity: .5; box-shadow: none; }

  /* ---------- Trạng thái: tải / lỗi / trống / mất mạng / hết phiên ---------- */
  .skel { border-radius: var(--radius-lg); background: linear-gradient(90deg, rgba(186,230,253,.45) 25%, rgba(255,255,255,.85) 50%, rgba(186,230,253,.45) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .state-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 32px 28px; text-align: center; }
  .state-ico { width: 72px; height: 72px; border-radius: 50%; background: var(--blue-light); color: var(--blue-dark); display: flex; align-items: center; justify-content: center; font-size: 32px; }
  #dashError { min-height: calc(var(--app-h, 100dvh) - 220px); }
  .state-view h3 { font-size: 19px; color: var(--text-primary); }
  .state-view p { font-size: 15px; color: var(--text-secondary); max-width: 280px; }
  .state-view .btn-ghost { margin-top: 6px; display: inline-flex; align-items: center; gap: 8px; }

  .offline-bar { position: absolute; left: 0; right: 0; top: 0; z-index: 90; display: flex; align-items: center; justify-content: center; gap: 8px; height: calc(var(--safe-top) + 36px); padding: var(--safe-top) 12px 0; background: var(--warn-bg); color: #78350F; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .has-offline .screen { padding-top: calc(var(--safe-top) + 36px); }
  .overlay { position: absolute; inset: 0; z-index: 95; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(15,23,42,.35); }
  .sheet { width: 100%; max-width: 340px; padding: 24px 20px 20px; background: #fff; border-radius: var(--radius-xl); text-align: center; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 24px 60px rgba(15,23,42,.25); }
  .sheet .state-ico { margin: 0 auto; }
  .sheet p { font-size: 15px; color: var(--text-secondary); }
  .sheet .btn-primary { margin-top: 8px; }

  .toast { position: absolute; top: calc(var(--safe-top) + 14px); left: 50%; z-index: 100; max-width: calc(100% - 32px); padding: 10px 18px; border-radius: var(--radius-pill); background: #075985; color: #fff; font-size: 14px; font-weight: 700; text-align: center; opacity: 0; transform: translate(-50%, -16px); pointer-events: none; transition: opacity .25s, transform .25s var(--ease-spring); box-shadow: 0 8px 20px rgba(3,105,161,.35); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .fx-heart { position: absolute; bottom: 120px; z-index: 50; font-size: 22px; pointer-events: none; animation: heartUp 2.1s ease-out forwards; }
  @keyframes heartUp { from { opacity: 1; transform: translateY(0) scale(.8); } to { opacity: 0; transform: translateY(-300px) scale(1.4) rotate(10deg); } }
  .shake { animation: shake .45s ease-in-out; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

  @media (hover: hover) {
    .feature:hover, .chat-widget:hover { transform: translateY(-3px); }

    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }

  }

  }

<body>

  /* Tạo DOM bằng textContent: dữ liệu từ máy chủ không bao giờ chạy như HTML */

      else if (k === 'text') n.textContent = v;

    bubs.forEach(([left, size, delay, dur]) => a.append(el('span', { class: 'bub', style: `left:${left}%;width:${size * 3}px;height:${size * 3}px;--s:${delay}s;--d:${dur}s` })));
    const spk = [[8, 12], [86, 22], [18, 58], [90, 70], [48, 8], [70, 90]];
    spk.forEach(([l, t], i) => a.append(el('span', { class: 'spk', style: `left:${l}%;top:${t}%;--s:${i * 0.7}s`, text: ['✦', '✧', '⋆'][i % 3] })));
  }

  /* ================== Hiển thị ================== */
  function renderLogin() {
    const a = data.auth;
    $('heroImg').src = imgSrc(a.heroImageUrl, 'hero');
    $('appTitle').textContent = a.appTitle; $('appSubtitle').textContent = a.appSubtitle;
    $('inAccount').placeholder = a.accountPlaceholder; $('inPassword').placeholder = a.passwordPlaceholder;
    $('btnLogin').textContent = a.loginButton;
    $('pairTitle').textContent = a.pairing.title; $('inPair').placeholder = a.pairing.placeholder; $('btnPair').textContent = a.pairing.button;
    setIcon($('btnTogglePwd'), $('inPassword').type === 'password' ? 'eyeOff' : 'eye');
    const msg = $('loginMsg'); msg.textContent = ui.loginError; msg.className = 'form-msg' + (ui.loginError ? ' err' : '');
    $('inAccount').classList.toggle('invalid', !!ui.loginError);
    $('inPassword').classList.toggle('invalid', !!ui.loginError);
  }

  function stateView(node, iconName, title, text, retry) {
    const kids = [el('div', { class: 'state-ico' }, icon(iconName)), el('h3', { text: title }), el('p', { text })];
    if (retry) kids.push(el('button', { class: 'btn-ghost', type: 'button', onclick: retry }, icon('refresh'), data.errors.retry));
    node.replaceChildren(...kids);
  }

  let cdTarget = Date.now() + data.dashboard.couple.countdownSeconds * 1000;
  function tickCountdown() {
    const left = Math.max(0, Math.round((cdTarget - Date.now()) / 1000));
    const t = $('cdTimer');
    t.textContent = `${fmt2(Math.floor(left / 3600))} h ${fmt2(Math.floor((left % 3600) / 60))} m ${fmt2(left % 60)} s`;
  }

  function renderDashboard() {
    const d = data.dashboard;
    $('dashTitle').textContent = d.headerTitle;
    $('bellDot').hidden = !d.hasNotification;
    const dot = $('bellDot');            // giữ tham chiếu trước khi replaceChildren gỡ nó ra
    $('btnBell').replaceChildren(icon('bell'), dot);
    $('coupleImg').src = imgSrc(d.couple.avatarUrl, 'me');
    $('coupleHeart').replaceChildren(icon('heart'));
    $('daysCount').textContent = `${d.couple.daysPrefix} ${d.couple.days} ${d.couple.daysUnit}`;
    $('cdLabel').textContent = d.couple.countdownLabel;
    tickCountdown();
    $('widgetTitle').textContent = d.chatWidget.heading;
    $('widgetAvatar').src = imgSrc(d.chatWidget.partnerAvatarUrl, 'partner');
    $('widgetName').textContent = d.chatWidget.partnerName;
    $('widgetLast').textContent = d.chatWidget.lastMessage;
    renderUnread();

    $('featureGrid').replaceChildren(...d.features.map((f) =>
      el('button', { class: 'feature', type: 'button', onclick: () => { emit('feature', { id: f.id }); toast(data.texts.featureOpened + f.title); } },
        el('span', { class: 'feature-ico' }, icon(f.icon)),
        el('span', { class: 'feature-label', text: f.title }))));

    $('bottomNav').replaceChildren(...d.nav.map((t) =>
      el('button', { class: 'nav-tab', type: 'button', 'aria-current': t.active ? 'page' : null, onclick: () => {
        d.nav.forEach((x) => { x.active = x.id === t.id; }); renderDashboard(); emit('nav', { id: t.id });
      } }, icon(t.icon), el('span', { text: t.label }))));
  }

  function renderUnread() {
    const n = data.dashboard.chatWidget.unread;
    const b = $('unread');
    b.hidden = n <= 0; b.textContent = n > 99 ? '99+' : String(n);
    b.setAttribute('aria-label', `${n} tin nhắn chưa đọc`);
  }

  function renderChatHead() {
    const c = data.chat;
    setIcon($('btnBack'), 'chevronLeft'); setIcon($('btnAudio'), 'phone'); setIcon($('btnVideo'), 'video');
    setIcon($('btnImage'), 'image'); setIcon($('btnSend'), 'send');
    $('roomAvatar').src = imgSrc(c.partnerAvatarUrl, 'partner');
    $('roomTitle').textContent = c.roomTitle; $('roomStatus').textContent = c.onlineText;
    $('chatInput').placeholder = c.inputPlaceholder;
    $('quickBar').replaceChildren(...c.quick.map((q) =>
      el('button', { class: 'quick', type: 'button', onclick: () => quickAction(q.id) },
        icon(q.icon), el('b', { text: q.title }), el('small', { text: q.sub }))));
  }

  function renderMessages() {
    const c = data.chat, partnerSrc = imgSrc(c.partnerAvatarUrl, 'partner');
    const nodes = [el('div', { class: 'day-sep', text: 'Hôm nay' })];
    const lastMine = [...c.messages].reverse().find((m) => m.from === 'me');
    c.messages.forEach((m) => {
      const meta = m.status === 'sending' ? 'Đang gửi…' : m.status === 'failed' ? 'Gửi lỗi. Chạm để gửi lại' : (m === lastMine ? `Đã gửi · ${m.time}` : m.time);
      nodes.push(el('div', { class: `msg ${m.from}${m.status === 'failed' ? ' failed' : ''}` },
        m.from === 'partner' ? el('img', { class: 'msg-avatar', src: partnerSrc, alt: '' }) : null,
        el('div', { class: 'bubble-col' }, el('div', { class: 'bubble selectable', text: m.text }), el('div', { class: 'msg-meta', text: meta }))));
    });
    if (c.partnerTyping) nodes.push(el('div', { class: 'typing', 'aria-label': 'Người ấy đang soạn tin' }, el('span'), el('span'), el('span')));
    $('stream').replaceChildren(...nodes);
    $('stream').scrollTop = $('stream').scrollHeight;
  }

  /* Gom mọi trạng thái hiển thị vào một chỗ để dễ thử và dễ bảo trì */
  function applyStatus() {
    const s = ui.status, e = data.errors;
    $('dashReady').hidden = !(s === 'ready' || s === 'empty'); $('dashLoading').hidden = s !== 'loading'; $('dashError').hidden = s !== 'error';
    if (s === 'error') stateView($('dashError'), 'alert', e.title, e.text, () => setStatus('loading', true));

    const empty = s === 'empty';
    $('stream').hidden = s !== 'ready';
    $('chatLoading').hidden = s !== 'loading'; $('chatError').hidden = s !== 'error'; $('chatEmpty').hidden = !empty;
    if (s === 'error') stateView($('chatError'), 'alert', e.title, e.text, () => setStatus('loading', true));
    if (empty) stateView($('chatEmpty'), 'messageHeart', data.empty.title, data.empty.text);
    $('quickBar').hidden = s === 'loading' || s === 'error';
    $('chatForm').hidden = s === 'loading' || s === 'error';

    const ob = $('offlineBar');
    ob.hidden = !ui.offline; $('appRoot').classList.toggle('has-offline', ui.offline);
    if (ui.offline) ob.replaceChildren(icon('wifiOff'), el('span', { text: data.texts.offline }));

    $('expiredOverlay').hidden = !ui.expired;
    if (ui.expired) {
      setIcon($('expIco'), 'lock');
      $('expTitle').textContent = data.expired.title; $('expText').textContent = data.expired.text; $('btnRelogin').textContent = data.expired.button;
    }
    document.querySelectorAll('.dev-panel [data-state]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === currentDevState)));
  }

  let currentDevState = 'ready';
  function setStatus(s, simulateLoad) {
    if (simulateLoad) { ui.status = 'loading'; applyStatus(); setTimeout(() => { ui.status = 'ready'; currentDevState = 'ready'; applyStatus(); }, 900); return; }
    ui.status = s; applyStatus();
  }

  /* ================== Điều hướng ================== */
  function navigateTo(id) {
    ui.screen = id;
    document.querySelectorAll('.screen').forEach((s) => {
      const on = s.id === id;
      s.classList.toggle('active', on); s.classList.remove('peek'); s.style.transform = '';
      if (on) s.removeAttribute('inert'); else s.setAttribute('inert', '');
    });
    if (id === 'screen-chat') { data.dashboard.chatWidget.unread = 0; renderUnread(); $('stream').scrollTop = $('stream').scrollHeight; }
    emit('screen', { id });
    updateDevPanel();
  }

  /* Vuốt từ mép trái để quay lại, giống app native */
  function initSwipeBack() {
    const chat = $('screen-chat'), dash = $('screen-dashboard');
    let startX = 0, dx = 0, on = false;
    chat.addEventListener('touchstart', (e) => { if (e.touches[0].clientX < 28) { startX = e.touches[0].clientX; dx = 0; on = true; chat.style.transition = 'none'; dash.style.transition = 'none'; dash.classList.add('peek'); } }, { passive: true });
    chat.addEventListener('touchmove', (e) => {
      if (!on) return;
      dx = Math.max(0, e.touches[0].clientX - startX);
      chat.style.transform = `translateX(${dx}px)`;
      dash.style.transform = `translateX(${(dx - innerWidth) * 0.3}px)`;
    }, { passive: true });
    chat.addEventListener('touchend', () => {
      if (!on) return; on = false;
      chat.style.transition = ''; dash.style.transition = '';
      if (dx > 100) navigateTo('screen-dashboard');
      else { chat.style.transform = ''; dash.style.transform = ''; dash.classList.remove('peek'); }
    });
  }

  /* ================== Hành động ================== */
  $('btnTogglePwd').addEventListener('click', () => {
    const p = $('inPassword'), show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    $('btnTogglePwd').setAttribute('aria-pressed', String(show));
    $('btnTogglePwd').setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    setIcon($('btnTogglePwd'), show ? 'eye' : 'eyeOff');
  });

  $('loginForm').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const acc = $('inAccount').value.trim(), pwd = $('inPassword').value;
    if (!acc || !pwd) { ui.loginError = data.texts.loginEmpty; renderLogin(); return; }
    if (ui.offline) { ui.loginError = data.texts.loginOffline; renderLogin(); return; }
    ui.loginError = ''; renderLogin();
    const btn = $('btnLogin'); btn.disabled = true; btn.replaceChildren(el('span', { class: 'spinner', 'aria-hidden': 'true' }), 'Đang đăng nhập…');
    emit('login', { account: acc });
    setTimeout(() => {
      btn.disabled = false; btn.textContent = data.auth.loginButton;
      if (pwd === 'wrong') { ui.loginError = data.texts.loginBad; renderLogin(); return; }   // chỉ để xem thử lỗi
      toast(data.texts.loginSuccess); navigateTo('screen-dashboard');
    }, 800);
  });

  $('btnPair').addEventListener('click', () => {
    const code = $('inPair').value.trim().toUpperCase();
    emit('pair', { code }); toast(data.texts.pairSent + (code || 'TPVT520'));
  });
  $('chatWidget').addEventListener('click', () => navigateTo('screen-chat'));
  $('btnBack').addEventListener('click', () => navigateTo('screen-dashboard'));
  $('btnBell').addEventListener('click', () => { data.dashboard.hasNotification = false; $('bellDot').hidden = true; emit('bell', {}); });
  $('btnAudio').addEventListener('click', () => emit('call', { kind: 'audio' }));
  $('btnVideo').addEventListener('click', () => emit('call', { kind: 'video' }));
  $('btnImage').addEventListener('click', () => emit('pickImage', {}));
  $('btnRelogin').addEventListener('click', () => { ui.expired = false; currentDevState = 'ready'; applyStatus(); navigateTo('screen-login'); });

  $('chatInput').addEventListener('input', () => { $('btnSend').disabled = !$('chatInput').value.trim(); });
  $('chatForm').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const input = $('chatInput'), text = input.value.trim();
    if (!text) return;
    const m = { id: Date.now(), from: 'me', text, time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false }), status: ui.offline ? 'failed' : 'sending' };
    data.chat.messages.push(m); data.dashboard.chatWidget.lastMessage = text;
    input.value = ''; $('btnSend').disabled = true;
    renderMessages(); $('widgetLast').textContent = text;
    emit('send', { id: m.id });
    if (!ui.offline) setTimeout(() => { delete m.status; renderMessages(); }, 700);
  });

  function quickAction(id) {
    const root = $('appRoot');
    if (id === 'heart') {
      ['❤️', '✨', '💙', '♥'].forEach((s, i) => { for (let k = 0; k < 2; k++) setTimeout(() => floatHeart(root, s), (i * 2 + k) * 90); });
    } else if (id === 'touch') {
      root.classList.remove('shake'); void root.offsetWidth; root.classList.add('shake');
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      toast(data.texts.touchSent);
    } else if (id === 'pulse') { floatHeart(root, '💓'); toast(data.texts.pulseSent); }
    emit('quick', { id });
  }
  function floatHeart(root, sym) {
    const h = el('div', { class: 'fx-heart', 'aria-hidden': 'true', text: sym, style: `left:${Math.floor(Math.random() * 70 + 12)}%` });
    root.append(h); setTimeout(() => h.remove(), 2100);
  }

  /* API cho phía native gọi qua evaluateJavaScript (không nhận postMessage từ nguồn lạ) */
  window.CoupleApp = {
    setData(next) { data = { ...data, ...next }; renderAll(); },
    navigate(id) { navigateTo(id); },
    setStatus(s) { currentDevState = s; ui.status = ['ready', 'loading', 'error', 'empty'].includes(s) ? s : 'ready'; applyStatus(); },
    sessionExpired() { ui.expired = true; applyStatus(); },
    pushIncomingMessage(text) {
      const time = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
      data.chat.messages.push({ id: Date.now(), from: 'partner', text: String(text), time });
      data.dashboard.chatWidget.lastMessage = String(text); $('widgetLast').textContent = String(text);
      if (ui.screen !== 'screen-chat') { data.dashboard.chatWidget.unread += 1; renderUnread(); } else renderMessages();
      toast(data.texts.incoming);
    }
  };

  /* ================== Mạng, bàn phím, vòng đời ================== */
  window.addEventListener('online', () => { ui.offline = false; applyStatus(); });
  window.addEventListener('offline', () => { ui.offline = true; applyStatus(); });

  const vv = window.visualViewport, root = $('appRoot');
  function syncViewport() {
    const h = vv ? vv.height : innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    root.classList.toggle('kb', vv ? innerHeight - vv.height > 120 : false);   // bàn phím đang mở
    if (vv && vv.offsetTop) window.scrollTo(0, 0);
  }
  if (vv) { vv.addEventListener('resize', syncViewport); vv.addEventListener('scroll', syncViewport); }
  syncViewport();

  setInterval(() => { if (!document.hidden) tickCountdown(); }, 1000);

  /* ================== Bảng xem thử (chỉ máy tính) ================== */
  function buildDevPanel() {
    const p = $('devPanel');
    const screens = [['screen-login', 'Đăng nhập'], ['screen-dashboard', 'Trang chính'], ['screen-chat', 'Trò chuyện']];
    const states = [['ready', 'Bình thường'], ['loading', 'Đang tải'], ['error', 'Lỗi + thử lại'], ['empty', 'Chat trống'], ['offline', 'Mất mạng'], ['expired', 'Hết phiên (401)'], ['loginerror', 'Lỗi đăng nhập']];
    p.append(el('h4', { text: 'MÀN HÌNH' }), ...screens.map(([id, label]) => el('button', { type: 'button', 'data-screen': id, onclick: () => navigateTo(id) }, label)));
    p.append(el('h4', { text: 'TRẠNG THÁI' }), ...states.map(([id, label]) => el('button', { type: 'button', 'data-state': id, 'aria-pressed': 'false', onclick: () => devState(id) }, label)));
  }
  function devState(id) {
    currentDevState = id;
    ui.offline = id === 'offline'; ui.expired = id === 'expired'; ui.loginError = id === 'loginerror' ? data.texts.loginBad : '';
    ui.status = ['loading', 'error', 'empty'].includes(id) ? id : 'ready';
    if (id === 'empty') data.chat = { ...data.chat, messages: [], partnerTyping: false }; else if (data.chat.messages.length === 0) data.chat = structuredClone(MOCK.chat);
    renderLogin(); renderMessages(); applyStatus();
  }
  function updateDevPanel() { document.querySelectorAll('.dev-panel [data-screen]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.screen === ui.screen))); }

  /* ================== Khởi động ================== */
  function renderAll() { renderLogin(); renderDashboard(); renderChatHead(); renderMessages(); applyStatus(); }
  buildAmbient(); buildDevPanel(); renderAll(); initSwipeBack();

  const q = new URLSearchParams(location.search);
  if (q.get('state')) devState(q.get('state'));
  if (q.get('screen') && $('screen-' + q.get('screen'))) navigateTo('screen-' + q.get('screen'));
  updateDevPanel();
})();
</script>
</body>
</html>
